
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

.gw-outer{
  display:flex;justify-content:center;
  padding:2rem 0;background:transparent;
}

.gw-frame{
  width:400px;height:600px;
  background:#1b1b1f;
  border-radius:28px;
  border:1px solid #2e2e38;
  display:flex;flex-direction:column;
  overflow:hidden;
  font-family:'Google Sans Text','Google Sans',sans-serif;
  position:relative;
}

.gw-topbar{
  display:flex;align-items:center;
  padding:16px 20px 0;
  gap:12px;
  flex-shrink:0;
}

.gw-avatar{
  width:32px;height:32px;border-radius:50%;
  background:#4a4458;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;color:#cac4d0;
  flex-shrink:0;cursor:pointer;
  border:2px solid #6750a4;
}

.gw-topbar-title{
  flex:1;
  font-size:14px;color:#e6e1e5;font-weight:500;
  font-family:'Google Sans',sans-serif;
}

.gw-icon-btn{
  width:40px;height:40px;border-radius:50%;
  border:none;background:transparent;
  color:#cac4d0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  transition:background 0.15s;
}
.gw-icon-btn:hover{background:#2e2e38;}

.gw-main{
  flex:1;display:flex;flex-direction:column;
  padding:0 20px;overflow:hidden;
}

.gw-home{
  flex:1;display:flex;flex-direction:column;
  justify-content:flex-end;padding-bottom:8px;
}

.gw-gemini-logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:20px;
}

.gw-g-icon{
  width:36px;height:36px;border-radius:12px;
  background:#2d2d37;
  display:flex;align-items:center;justify-content:center;
}

.gw-g-dots{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
  width:16px;height:16px;
}

.gw-dot{
  width:6px;height:6px;border-radius:50%;
}

.gw-greeting{
  font-size:13px;color:#938f99;font-weight:400;
  margin-bottom:4px;
}

.gw-headline{
  font-family:'Google Sans',sans-serif;
  font-size:24px;font-weight:400;
  line-height:1.25;margin-bottom:24px;
}

.gw-headline span{display:block;}
.gw-hl-blue{color:#a8c7fa;}
.gw-hl-purple{color:#d0bcff;}

.gw-suggestions{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:20px;
}

.gw-suggestion{
  display:flex;align-items:center;gap:12px;
  background:#2d2d37;border:1px solid #3a3a48;
  border-radius:16px;padding:12px 16px;
  cursor:pointer;text-align:left;
  transition:background 0.15s,border-color 0.15s;
  width:100%;
}

.gw-suggestion:hover{background:#353545;border-color:#6750a4;}

.gw-sug-icon{
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}

.gw-sug-icon.blue{background:#1a2d4a;color:#a8c7fa;}
.gw-sug-icon.green{background:#1a2e1e;color:#b5ccb8;}
.gw-sug-icon.yellow{background:#302a14;color:#f9c858;}
.gw-sug-icon.red{background:#2e1a1a;color:#f28b82;}

.gw-sug-text{
  flex:1;
}
.gw-sug-label{
  font-size:13px;color:#e6e1e5;font-weight:500;
  display:block;line-height:1.3;
}
.gw-sug-sub{
  font-size:11px;color:#938f99;display:block;margin-top:1px;
}

.gw-sug-arrow{
  font-size:14px;color:#625b71;flex-shrink:0;
}

.gw-inputbar{
  background:#2d2d37;
  border-radius:100px;
  display:flex;align-items:center;
  padding:6px 6px 6px 18px;
  gap:6px;
  margin-bottom:16px;
  border:1px solid #3a3a48;
  transition:border-color 0.15s;
  flex-shrink:0;
}

.gw-inputbar:focus-within{border-color:#6750a4;}

.gw-input{
  flex:1;background:transparent;border:none;outline:none;
  color:#e6e1e5;font-family:'Google Sans Text',sans-serif;
  font-size:14px;caret-color:#d0bcff;
}
.gw-input::placeholder{color:#625b71;}

.gw-input-pill-btn{
  width:36px;height:36px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all 0.15s;flex-shrink:0;
}

.gw-input-pill-btn.cam{background:#353545;color:#cac4d0;}
.gw-input-pill-btn.cam:hover{background:#3f3f50;color:#e6e1e5;}
.gw-input-pill-btn.mic{background:#353545;color:#cac4d0;}
.gw-input-pill-btn.mic:hover{background:#3f3f50;color:#d0bcff;}
.gw-input-pill-btn.send{background:#6750a4;color:#ffffff;}
.gw-input-pill-btn.send:hover{background:#7965af;}
.gw-input-pill-btn.send:active{transform:scale(0.94);}
.gw-input-pill-btn.send.hidden{background:#353545;color:#625b71;pointer-events:none;}

.gw-chat-view{
  display:none;flex:1;flex-direction:column;overflow:hidden;
}
.gw-chat-view.active{display:flex;}

.gw-messages{
  flex:1;overflow-y:auto;padding:12px 0 8px;
  display:flex;flex-direction:column;gap:10px;
}
.gw-messages::-webkit-scrollbar{width:3px;}
.gw-messages::-webkit-scrollbar-thumb{background:#3a3a48;border-radius:2px;}

.gw-bubble-row{display:flex;gap:8px;}
.gw-bubble-row.user{flex-direction:row-reverse;}

.gw-bubble-avatar{
  width:28px;height:28px;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;margin-top:2px;
}
.gw-bubble-avatar.ai{background:#2d2d37;border:1px solid #4a4458;}
.gw-bubble-avatar.user{background:#4a4458;color:#cac4d0;border:2px solid #6750a4;}

.gw-bubble{
  max-width:80%;border-radius:20px;
  padding:9px 14px;font-size:13px;line-height:1.5;
}
.gw-bubble.ai{
  background:#2d2d37;color:#e6e1e5;
  border-radius:4px 20px 20px 20px;
}
.gw-bubble.user{
  background:#4a3f6b;color:#e6e1e5;
  border-radius:20px 4px 20px 20px;
}

.gw-typing{
  display:flex;gap:4px;align-items:center;padding:4px 0;
}
.gw-typing span{
  width:6px;height:6px;border-radius:50%;
  background:#625b71;
  animation:typingDot 1.2s ease infinite;
}
.gw-typing span:nth-child(2){animation-delay:.2s;}
.gw-typing span:nth-child(3){animation-delay:.4s;}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}

.gw-fab-row{
  display:flex;gap:8px;padding:10px 0 4px;overflow-x:auto;flex-shrink:0;
}
.gw-fab-row::-webkit-scrollbar{display:none;}

.gw-fab{
  display:flex;align-items:center;gap:6px;
  background:#2d2d37;border:1px solid #3a3a48;
  border-radius:100px;padding:6px 12px;
  font-size:12px;color:#cac4d0;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  transition:all 0.15s;font-family:'Google Sans Text',sans-serif;
}
.gw-fab:hover{background:#353545;border-color:#6750a4;color:#d0bcff;}

.gw-divider{
  height:0.5px;background:#2e2e38;
  margin:0;flex-shrink:0;
}

.anim-in{animation:slideUp 0.2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>

<h2 class="sr-only">Widget estilo Google Material You para asistente Gemini en Game Bar</h2>

<div class="gw-outer">
  <div class="gw-frame">

    <div class="gw-topbar">
      <div class="gw-avatar" title="Perfil">SK</div>
      <span class="gw-topbar-title" id="topTitle">Gemini</span>
      <button class="gw-icon-btn" onclick="goHome()" title="Inicio" aria-label="Inicio">
        <i class="ti ti-home" aria-hidden="true"></i>
      </button>
      <button class="gw-icon-btn" title="Más opciones" aria-label="Más opciones">
        <i class="ti ti-dots-vertical" aria-hidden="true"></i>
      </button>
    </div>

    <div class="gw-main">

      <div id="homeView" class="gw-home">
        <div class="gw-gemini-logo">
          <div class="gw-g-icon">
            <div class="gw-g-dots">
              <div class="gw-dot" style="background:#a8c7fa;"></div>
              <div class="gw-dot" style="background:#f28b82;"></div>
              <div class="gw-dot" style="background:#f9c858;"></div>
              <div class="gw-dot" style="background:#b5ccb8;"></div>
            </div>
          </div>
          <span style="font-family:'Google Sans',sans-serif;font-size:16px;font-weight:500;color:#e6e1e5;letter-spacing:0.01em;">Gemini</span>
        </div>

        <p class="gw-greeting">Hola, SkylineKILLER00</p>
        <h1 class="gw-headline">
          <span class="gw-hl-blue">¿En qué puedo</span>
          <span class="gw-hl-purple">ayudarte hoy?</span>
        </h1>

        <div class="gw-suggestions">
          <button class="gw-suggestion" onclick="startChat('Recomendaciones de juegos para mi perfil')">
            <div class="gw-sug-icon blue"><i class="ti ti-device-gamepad-2" aria-hidden="true"></i></div>
            <div class="gw-sug-text">
              <span class="gw-sug-label">Recomendaciones de juegos</span>
              <span class="gw-sug-sub">Basado en tu historial de juego</span>
            </div>
            <i class="ti ti-arrow-right gw-sug-arrow" aria-hidden="true"></i>
          </button>
          <button class="gw-suggestion" onclick="startChat('Mostrar mis logros de Xbox')">
            <div class="gw-sug-icon yellow"><i class="ti ti-trophy" aria-hidden="true"></i></div>
            <div class="gw-sug-text">
              <span class="gw-sug-label">Mis logros de Xbox</span>
              <span class="gw-sug-sub">318 logros · Gamerscore 48,320</span>
            </div>
            <i class="ti ti-arrow-right gw-sug-arrow" aria-hidden="true"></i>
          </button>
          <button class="gw-suggestion" onclick="startChat('Analiza mi última captura de pantalla')">
            <div class="gw-sug-icon green"><i class="ti ti-screenshot" aria-hidden="true"></i></div>
            <div class="gw-sug-text">
              <span class="gw-sug-label">Analizar captura</span>
              <span class="gw-sug-sub">Captura la pantalla activa del juego</span>
            </div>
            <i class="ti ti-arrow-right gw-sug-arrow" aria-hidden="true"></i>
          </button>
        </div>

        <div class="gw-inputbar">
          <input class="gw-input" id="homeInput" placeholder="Pregúntame lo que quieras"
            onkeydown="if(event.key==='Enter')submitHome()"
            oninput="toggleSend(this,'homeSend')" />
          <button class="gw-input-pill-btn cam" onclick="captureFn()" title="Capturar pantalla" aria-label="Capturar pantalla">
            <i class="ti ti-screenshot" aria-hidden="true"></i>
          </button>
          <button class="gw-input-pill-btn mic" onclick="micFn()" title="Micrófono" aria-label="Dictado por voz">
            <i class="ti ti-microphone" aria-hidden="true"></i>
          </button>
          <button class="gw-input-pill-btn send hidden" id="homeSend" onclick="submitHome()" title="Enviar" aria-label="Enviar">
            <i class="ti ti-arrow-up" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div id="chatView" class="gw-chat-view">
        <div class="gw-fab-row" id="fabRow">
          <button class="gw-fab" onclick="insertFab('Capturar pantalla')">
            <i class="ti ti-screenshot" style="font-size:14px;" aria-hidden="true"></i> Capturar
          </button>
          <button class="gw-fab" onclick="insertFab('Mostrar mis logros')">
            <i class="ti ti-trophy" style="font-size:14px;" aria-hidden="true"></i> Logros
          </button>
          <button class="gw-fab" onclick="insertFab('Dame tips para este juego')">
            <i class="ti ti-bulb" style="font-size:14px;" aria-hidden="true"></i> Tips
          </button>
          <button class="gw-fab" onclick="insertFab('¿Cuál es mi estadística de juego?')">
            <i class="ti ti-chart-bar" style="font-size:14px;" aria-hidden="true"></i> Stats
          </button>
        </div>

        <div class="gw-divider"></div>

        <div class="gw-messages" id="msgList"></div>

        <div class="gw-inputbar" style="margin-bottom:16px;margin-top:8px;">
          <input class="gw-input" id="chatInput" placeholder="Escribe un mensaje..."
            onkeydown="if(event.key==='Enter')submitChat()"
            oninput="toggleSend(this,'chatSend')" />
          <button class="gw-input-pill-btn cam" onclick="captureFn()" title="Capturar" aria-label="Capturar pantalla">
            <i class="ti ti-screenshot" aria-hidden="true"></i>
          </button>
          <button class="gw-input-pill-btn mic" onclick="micFn()" title="Voz" aria-label="Voz">
            <i class="ti ti-microphone" aria-hidden="true"></i>
          </button>
          <button class="gw-input-pill-btn send hidden" id="chatSend" onclick="submitChat()" title="Enviar" aria-label="Enviar">
            <i class="ti ti-arrow-up" aria-hidden="true"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const replies = [
  'Claro, déjame revisar eso por ti.',
  'Basado en tu perfil de juego, te puedo dar algunas recomendaciones.',
  'Analizando el contexto de tu sesión activa...',
  'Encontré información relevante sobre ese tema.',
  '¡Buena pregunta! Aquí está lo que encontré.'
];
let msgCount = 0;

function toggleSend(input, btnId) {
  const btn = document.getElementById(btnId);
  if (input.value.trim()) {
    btn.classList.remove('hidden');
  } else {
    btn.classList.add('hidden');
  }
}

function addMsg(who, text) {
  const list = document.getElementById('msgList');
  const row = document.createElement('div');
  row.className = 'gw-bubble-row ' + who + ' anim-in';

  const avatarHtml = who === 'ai'
    ? `<div class="gw-bubble-avatar ai"><i class="ti ti-sparkles" style="font-size:12px;color:#d0bcff;" aria-hidden="true"></i></div>`
    : `<div class="gw-bubble-avatar user">SK</div>`;

  row.innerHTML = avatarHtml + `<div class="gw-bubble ${who}">${text}</div>`;
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}

function addTyping() {
  const list = document.getElementById('msgList');
  const row = document.createElement('div');
  row.className = 'gw-bubble-row ai';
  row.id = 'typingRow';
  row.innerHTML = `<div class="gw-bubble-avatar ai"><i class="ti ti-sparkles" style="font-size:12px;color:#d0bcff;" aria-hidden="true"></i></div>
    <div class="gw-bubble ai"><div class="gw-typing"><span></span><span></span><span></span></div></div>`;
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function startChat(text) {
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('chatView').classList.add('active');
  document.getElementById('topTitle').textContent = 'Gemini';
  addMsg('user', text);
  addTyping();
  setTimeout(() => {
    removeTyping();
    addMsg('ai', replies[msgCount % replies.length]);
    msgCount++;
  }, 1000);
}

function submitHome() {
  const inp = document.getElementById('homeInput');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  document.getElementById('homeSend').classList.add('hidden');
  startChat(val);
}

function submitChat() {
  const inp = document.getElementById('chatInput');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  document.getElementById('chatSend').classList.add('hidden');
  addMsg('user', val);
  addTyping();
  setTimeout(() => {
    removeTyping();
    addMsg('ai', replies[msgCount % replies.length]);
    msgCount++;
  }, 900);
}

function insertFab(text) {
  const inp = document.getElementById('chatInput');
  inp.value = text;
  toggleSend(inp, 'chatSend');
  inp.focus();
}

function captureFn() {
  if (document.getElementById('chatView').classList.contains('active')) {
    addMsg('user', '<i class="ti ti-screenshot" style="vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i> Captura enviada');
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('ai', 'Recibí la captura. ¿Qué te gustaría saber sobre lo que aparece en pantalla?');
      msgCount++;
    }, 900);
  } else {
    startChat('Capturar pantalla del juego activo');
  }
}

function micFn() {
  if (document.getElementById('chatView').classList.contains('active')) {
    addMsg('user', '<i class="ti ti-microphone" style="vertical-align:-2px;margin-right:4px;color:#d0bcff;" aria-hidden="true"></i> Dictado de voz activado...');
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('ai', 'Escuché tu mensaje. ¿En qué te puedo ayudar?');
      msgCount++;
    }, 1200);
  } else {
    startChat('Usar dictado por voz');
  }
}

function goHome() {
  document.getElementById('chatView').classList.remove('active');
  document.getElementById('homeView').style.display = '';
  document.getElementById('msgList').innerHTML = '';
  document.getElementById('topTitle').textContent = 'Gemini';
  msgCount = 0;
}
</script>
